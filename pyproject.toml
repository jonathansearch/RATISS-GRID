[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratiss-grid"
version = "0.1.0"
description = "Coffre-fort énergétique souverain — Priorité 0 (micro-réseau PV + LiFePO4 + supercaps dimensionné par topologie)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ratiss_grid*"]
